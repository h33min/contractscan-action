# .github/workflows/contractscan.yml
#
# ContractScan — Automatic smart contract vulnerability scanning
#
# Setup:
#   1. Copy this file to .github/workflows/contractscan.yml in your repo
#   2. (Optional) Add a CONTRACTSCAN_API_KEY secret for unlimited scans
#      Free tier works without an API key (3 scans per IP)
#
# The scan runs on every push and pull request.
# It fails CI if any Critical vulnerabilities are found.

name: Smart Contract Security Scan

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - '**/*.sol'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**/*.sol'

jobs:
  contractscan:
    name: ContractScan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # needed to post PR comments (optional)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scan smart contracts
        id: scan
        uses: h33min/contractscan-action@v1
        with:
          api-key: ${{ secrets.CONTRACTSCAN_API_KEY }}  # optional — free tier works without it
          path: '**/*.sol'          # scan all Solidity files
          fail-on: 'Critical'       # fail CI on Critical findings (High, Medium, Low also available)
          report-format: 'markdown' # markdown | json

      # Optional: post scan results as a PR comment
      - name: Post PR comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.scan.outputs.passed }}' === 'true';
            const findings = '${{ steps.scan.outputs.findings-count }}';
            const critical = '${{ steps.scan.outputs.critical-count }}';
            const icon = passed ? '✅' : '❌';
            const body = `## ${icon} ContractScan Results\n\n` +
              `**Status**: ${passed ? 'PASSED' : 'FAILED'} | ` +
              `**Findings**: ${findings} | **Critical**: ${critical}\n\n` +
              `See the [full report](${context.payload.pull_request.html_url}/checks) in the Actions summary.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
